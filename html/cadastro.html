<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempic | Cadastro</title>
    <link rel="icon" type="image/png" href="../img/logonova.png">
</head>

<body>

    <!-- =====================================================
         PRELOADER PREMIUM — NOVAERA CODE
         ===================================================== -->
    <div id="preloader" role="status" aria-live="polite" aria-label="Carregando NovaEra Code">
        <div class="preloader-grid"></div>
        <div class="preloader-glow"></div>

        <div class="preloader-content">
            <div class="preloader-brand">
                <div class="preloader-logo-wrap">
                    <img class="preloader-logo" src="../img/logonova.png" alt="NovaEra Code">
                </div>

                <div>
                    <h1 class="preloader-title">Nova<span>Era</span> Code</h1>
                    <p class="preloader-subtitle">Tecnologia • inovação • resultados</p>
                </div>
            </div>

            <div class="preloader-status">
                <span id="preloaderStatus">Inicializando...</span>
                <span id="preloaderPercent">0%</span>
            </div>

            <div class="preloader-bar" aria-hidden="true">
                <div class="preloader-bar-fill" id="preloaderFill"></div>
            </div>

            <div class="preloader-dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>


    <link rel="stylesheet" href="../css/cadastro.css">
    <div class="register-page">

        <div class="register-banner">

            <img src="../img/logonova.png" alt="NovaEra Code">

            <h1>NovaEra Code</h1>

            <p>
                Transformando ideias em soluções digitais.
            </p>

        </div>

        <div class="register-container">

            <div class="form-header">
                <h2>Criar Conta</h2>
                <p>Preencha os dados para começar</p>
            </div>

            <form action="../php/cadastro.php" method="POST">

                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>

                    <div class="password-wrapper">

                        <input type="password" name="senha" id="senha" placeholder="Crie uma senha segura" required>

                        <button type="button" id="togglePassword">
                            👁
                        </button>

                    </div>

                    <div class="password-strength">
                        <span id="strength-text">
                            Segurança da senha
                        </span>
                    </div>

                </div>

                <button type="submit" class="btn-register">
                    Criar Conta
                </button>

            </form>

            <div class="login-link">
                Já possui uma conta?
                <a href="login.html">
                    Entrar
                </a>
            </div>

        </div>

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
